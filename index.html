<style>
:root{
  --gold:#e0b251;
  --line:#5a4cc0;
  --panel:#14123f;
  --text:#eceaf7;
  --muted:#b9b4e0;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.98vw,24px)}
html,body{margin:0;min-height:100%}
body{
  background:linear-gradient(180deg,#090928 0%,#17154a 50%,#3a1f7a 100%) fixed #17154a;
  color:var(--text);
  font-family:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
canvas.bg{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 46%,#000 58%);
  mask-image:linear-gradient(to bottom,transparent 46%,#000 58%);
}
.page{
  position:relative;z-index:1;
  min-height:100svh;max-width:2300px;margin:0 auto;
  padding:2rem clamp(20px,3.6vw,140px);
  display:flex;flex-direction:column;justify-content:space-between;gap:1.5rem;
}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
h1{margin:0;font-size:2.7rem;font-weight:600;line-height:1.25}
.role{margin:.35rem 0 0;color:var(--gold);font-size:1.2rem}
.lang{
  display:flex;align-items:center;gap:2px;
  border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:3px;
  font-size:.95rem;direction:ltr;flex-shrink:0;
}
.lang button{
  font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;
  padding:.2rem .7rem;border-radius:2px;
}
.lang button[aria-pressed="true"]{color:var(--gold)}
.lang i{width:1px;height:1em;background:var(--line)}
.mid{display:flex;justify-content:space-between;align-items:stretch;gap:2.5rem}
.calm{
  flex:1;max-width:74rem;display:flex;flex-direction:column;justify-content:center;
  background:rgba(11,10,42,.95);border:1px solid rgba(90,76,192,.35);border-radius:4px;
  padding:1.6rem 1.8rem;
}
.about{margin:0 0 1.2rem;font-size:1.2rem;line-height:1.95;color:#e8e5f8}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{
  font-size:.9rem;padding:.3rem .8rem;border:1px solid var(--line);border-radius:3px;
  color:#d6d1f8;background:#1a1850;
}
.edu{margin:1.2rem 0 0;padding-top:.9rem;border-top:1px solid rgba(90,76,192,.35);font-size:.95rem;color:var(--muted)}
.slider{width:clamp(300px,29vw,700px);flex-shrink:0;display:flex;flex-direction:column}
.frame{
  position:relative;flex:1;min-height:0;aspect-ratio:16/10;border:1px solid var(--line);border-radius:4px;
  background:#fff;overflow:hidden;
}
.cap{
  position:absolute;top:0;left:0;right:0;z-index:2;
  padding:.55rem 1rem;font-size:1.05rem;font-weight:500;color:var(--gold);text-align:center;
  background:#3814d617;border-bottom:1px solid var(--line);
  text-shadow:0 1px 3px rgba(8,5,35,.95),0 0 8px rgba(8,5,35,.85);
  pointer-events:none;
}
.track{display:flex;height:100%;direction:ltr;will-change:transform}
.track.go{transition:transform .45s cubic-bezier(.65,0,.35,1)}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.dots{display:flex;justify-content:center;gap:.6rem;margin-top:.8rem}
.dots button{
  width:.55rem;height:.55rem;padding:0;border:0;border-radius:50%;background:#5b4fb8;cursor:pointer;
}
.dots button.on{background:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.card{
  border:1px solid var(--line);background:rgba(14,12,56,.4);border-radius:4px;padding:1.05rem 1.2rem;
}
.card b{display:block;font-weight:500;font-size:.9rem;color:var(--gold)}
.card span{display:block;margin-top:.3rem;font-size:1.15rem}
.contacts{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.9rem}
.ct{
  color:#d6d1f8;text-decoration:none;font-size:1.05rem;direction:ltr;unicode-bidi:isolate;
  border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:.6rem 1.2rem;
  transition:border-color .2s,color .2s;
}
.ct:hover,.ct:focus-visible{border-color:var(--gold);color:#fff;outline:none}
html[lang="en"] .fa-only{display:none}
@media (max-width:820px){
  .mid{align-items:stretch}
  .mid{flex-direction:column;align-items:stretch}
  .calm{max-width:none}
  .slider{width:min(100%,380px);align-self:center}
  .cards{grid-template-columns:repeat(2,1fr)}
  .contacts{flex-direction:column}
  .ct{text-align:center}
}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.track.go{transition:none}}
</style>
</head>

    <div class="calm">
      <p class="about"
         data-fa="بیش از ۸ سال تجربه عملی در طراحی سخت‌افزار و توسعه برد مدار چاپی. طراحی بردهای چندلایه پیچیده، سرعت بالا، فرکانس بالا، آنالوگ و دیجیتال؛ از ایده تا تولید، با تمرکز بر طرح‌های قابل‌اعتماد، قابل‌ساخت و مقرون‌به‌صرفه."
         data-en="8+ years of hands-on experience in hardware design and PCB development. Complex multilayer boards, high-speed, high-frequency, analog and digital circuits, from concept to production, with a focus on reliable, manufacturable and cost-effective design."></p>
      <div class="chips">
        <span class="chip" data-fa="ترسیم شماتیک" data-en="Schematic capture"></span>
        <span class="chip" data-fa="چیدمان PCB" data-en="PCB layout"></span>
        <span class="chip" data-fa="انتخاب قطعات" data-en="Component selection"></span>
        <span class="chip" data-fa="طراحی فرکانس بالا" data-en="High-frequency design"></span>
        <span class="chip" data-fa="عیب‌یابی سخت‌افزار" data-en="Hardware debugging"></span>
        <span class="chip" data-fa="سیستم‌های نهفته" data-en="Embedded systems"></span>
        <span class="chip" data-fa="Altium Designer" data-en="Altium Designer"></span>
      </div>
      <p class="edu" data-fa="کارشناسی مهندسی برق و الکترونیک · دانشگاه صنعتی اصفهان" data-en="BSc Electrical and Electronics Engineering · Isfahan University of Technology"></p>
    </div>

    <div class="slider" aria-label="PCB projects">
      <div class="frame" id="frame">
        <div class="cap" data-fa="برخی از نمونه‌کارها" data-en="Some of my projects"></div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <section class="cards">
    <div class="card"><b data-fa="طراح سخت‌افزار" data-en="Hardware designer"></b><span data-fa="شرکت بهبود ارتباط" data-en="Behbood Ertebat"></span></div>
    <div class="card"><b data-fa="مدیر آزمایشگاه Altium Designer" data-en="Altium Designer lab manager"></b><span data-fa="دانشگاه صنعتی اصفهان" data-en="Isfahan University of Technology"></span></div>
    <div class="card"><b data-fa="طراحی و تعمیر برد الکترونیکی" data-en="PCB design and repair"></b><span data-fa="تریلی، کامیون و اتوبوس" data-en="Trailers, trucks and buses"></span></div>
    <div class="card"><b data-fa="پروژه‌های متنوع" data-en="Various projects"></b><span data-fa="برای ارگان‌های مختلف" data-en="For different organizations"></span></div>
  </section>

  <footer class="contacts">
    <a class="ct fa-only" href="tel:+989381870918">0938 187 0918</a>
    <a class="ct" href="mailto:danial.salehi.eng@gmail.com">danial.salehi.eng@gmail.com</a>

  </footer>
</main>

  var BASE_SPEED=65;        /* average speed of normal pulses, px/s */
  var FAST_SPEED=BASE_SPEED*4;
  var TRAIL_SEC=0.2;        /* the halo behind the red and gold pulses fades after this many seconds */

  var W,H,dpr,TOP,paths,pulses,comets,seed,last=0,raf,rt;

  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  function prep(p){
    var c=[0],i,L=0;
    for(i=1;i<p.length;i++){L+=Math.abs(p[i][0]-p[i-1][0])+Math.abs(p[i][1]-p[i-1][1]);c.push(L)}
    return {pts:p,cum:c,len:L};
  }
  function walk(x0,x1,n){      /* random right-angle walk inside [x0,x1] x [TOP,H] */
    var x=x0+Math.round(rnd()*((x1-x0)/G))*G,y=TOP+Math.round(rnd()*((H-TOP)/G))*G;
    var horiz=rnd()<.5,pts=[[x,y]],s,st;
    for(s=0;s<n;s++){
      st=(1+Math.floor(rnd()*2))*G*(rnd()<.5?-1:1);
      if(horiz){if(x+st<x0||x+st>x1)st=-st;x+=st}
      else{if(y+st<TOP||y+st>H)st=-st;y+=st}
      pts.push([x,y]);horiz=!horiz;
    }
    return prep(pts);
  }
  function wander(){return walk(-G,W+G,8+Math.floor(rnd()*16))}
  function roam(){return walk(Math.round(W*.2),Math.round(W*.8),95)}   /* gold pulse: stays in the middle */
  function sweep(){            /* red pulse: enters at the left edge, leaves at the right edge, wiggles up and down */
    var x=-G,y=TOP+Math.round(rnd()*((H-TOP)/G))*G,pts=[[x,y]],st,guard=0;
    while(x<W+G&&guard++<3000){
      x+=(1+Math.floor(rnd()*3))*G;pts.push([x,y]);
      st=(1+Math.floor(rnd()*2))*G*(rnd()<.5?-1:1);
      if(y+st<TOP||y+st>H)st=-st;
      y+=st;pts.push([x,y]);
    }
    return prep(pts);
  }
  function pointAt(p,d){
    var c=p.cum,lo=0,hi=c.length-1,m;
    while(hi-lo>1){m=(lo+hi)>>1;if(c[m]<=d)lo=m;else hi=m}
    var seg=c[hi]-c[lo]||1,f=(d-c[lo])/seg,a=p.pts[lo],b=p.pts[hi];
    return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,lo,hi];
  }
  function strokeRange(ctx,p,d0,d1){
    if(d1<=d0)return;
    d0=Math.max(0,d0);d1=Math.min(p.len,d1);
    if(d1<=d0)return;
    var s=pointAt(p,d0),e=pointAt(p,d1),k;
    ctx.beginPath();ctx.moveTo(s[0],s[1]);
    for(k=s[3];k<=e[2];k++)ctx.lineTo(p.pts[k][0],p.pts[k][1]);
    ctx.lineTo(e[0],e[1]);ctx.stroke();
  }

  function build(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    [cb,ca].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)});
    bx.setTransform(dpr,0,0,dpr,0,0);ax.setTransform(dpr,0,0,dpr,0,0);
    seed=7;
    TOP=Math.round(H*.46/G)*G;
    var area=W*(H-TOP),n=Math.max(40,Math.min(560,Math.round(area/2900))),i;
    paths=[];for(i=0;i<n;i++)paths.push(wander());
    var redRoutes=[],goldRoutes=[];
    for(i=0;i<5;i++)redRoutes.push(sweep());
    for(i=0;i<5;i++)goldRoutes.push(roam());

    bx.clearRect(0,0,W,H);
    bx.strokeStyle='rgba(127,119,221,.24)';bx.lineWidth=1;
    bx.beginPath();
    paths.concat(redRoutes,goldRoutes).forEach(function(p){
      bx.moveTo(p.pts[0][0],p.pts[0][1]);
      for(var k=1;k<p.pts.length;k++)bx.lineTo(p.pts[k][0],p.pts[k][1]);
    });
    bx.stroke();

    pulses=[];
    var count=Math.max(14,Math.min(150,Math.round(area/5200)));
    for(i=0;i<count;i++){
      pulses.push({p:paths[Math.floor(Math.random()*paths.length)],d:0,v:40+Math.random()*50,wait:Math.random()*5});
    }
    comets=[
      {routes:redRoutes, core:'225,110,118',halo:'235,150,160',wait:1.2,route:null,d:0},
      {routes:goldRoutes,core:'222,180,92', halo:'240,208,145',wait:2.2,route:null,d:0}
    ];
  }

  function drawComet(c,dt){
    if(c.wait>0){
      c.wait-=dt;
      if(c.wait<=0){c.route=c.routes[Math.floor(Math.random()*c.routes.length)];c.d=0}
      return;
    }
    c.d+=FAST_SPEED*dt;
    var trail=FAST_SPEED*TRAIL_SEC,k,steps=8,a,b,f;
    for(k=0;k<steps;k++){
      a=c.d-trail*(1-k/steps);b=c.d-trail*(1-(k+1)/steps);f=(k+1)/steps;
      ax.lineWidth=7;ax.strokeStyle='rgba('+c.halo+','+(.14*f)+')';strokeRange(ax,c.route,a,b);
      ax.lineWidth=1.8;ax.strokeStyle='rgba('+c.core+','+(.9*f)+')';strokeRange(ax,c.route,a,b);
    }
    var hp=pointAt(c.route,Math.min(c.d,c.route.len));
    ax.fillStyle='rgba('+c.core+',.95)';ax.beginPath();ax.arc(hp[0],hp[1],2.4,0,6.2832);ax.fill();
    if(c.d-trail>c.route.len){c.wait=2.5+Math.random()*2.5;c.route=null}
  }

  function frame(t){
    var dt=Math.min((t-last)/1000||0,.05);last=t;
    ax.clearRect(0,0,W,H);
    ax.lineCap='round';ax.lineJoin='round';
    var i,q,tail=20;
    for(i=0;i<pulses.length;i++){
      q=pulses[i];
      if(q.wait>0){q.wait-=dt;continue}
      q.d+=q.v*dt;
      if(q.d-tail>q.p.len){q.d=0;q.wait=Math.random()*3;q.p=paths[Math.floor(Math.random()*paths.length)];continue}
      ax.lineWidth=1.5;
      ax.strokeStyle='rgba(154,149,207,.13)';strokeRange(ax,q.p,q.d-tail,q.d-tail*.66);
      ax.strokeStyle='rgba(154,149,207,.33)';strokeRange(ax,q.p,q.d-tail*.66,q.d-tail*.33);
      ax.strokeStyle='rgba(154,149,207,.65)';strokeRange(ax,q.p,q.d-tail*.33,q.d);
    }
    drawComet(comets[0],dt);
    drawComet(comets[1],dt);
    raf=requestAnimationFrame(frame);
  }

  function start(){
    cancelAnimationFrame(raf);build();
    if(reduce)return;
    last=performance.now();raf=requestAnimationFrame(frame);
  }
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(start,200)});
  start();
})();
</script>
</body>
</html>
